<ng-template #content>

  <div class="flex items-center ">

    <div class="logoSection hover:cursor-pointer">
      <img src="assets/images/logo_lui.png" class="w-20 h-w-20" alt="logo" />

    </div>

  </div>
  <hr class="w-full mx-auto my-4 border-blue-gray-50" />


</ng-template>

<div class="hidden w-full h-full desktop md:block">
  <div class="relative flex flex-col w-full h-full p-4 px-2 text-gray-700 shadow-md bg-surface-50 bg-clip-border ">
    <ng-container *ngTemplateOutlet="content"></ng-container>

  </div>

</div>

<div class="w-full h-full mobile md:hidden">
  <app-sidebar [headerLogo]="false" [fullSpace]="true">
    <ng-container content *ngTemplateOutlet="content"></ng-container>

  </app-sidebar>
</div>
