
<div class="popover-trigger" (click)="op.toggle($event)">
  <ng-content select="[button]"></ng-content>
</div>

<p-popover #op>
  <div class="flex flex-col gap-4">
    <div>
      @if(title()){
        <span class="block mb-2 text-sm font-semibold">
          {{ title() }}
        </span>
      }
      <app-nested-menu [menu]="menu()" />

    </div>
  </div>
</p-popover>
