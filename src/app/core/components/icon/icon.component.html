

{{ className() }}

<div class="flex items-center justify-center iconContent h-fit ">
  @if(type() === 'src'){
    <img  src="{{ value() }}" alt="icon" [class]="className() + ' ' + this.icon().type" />
  }
  @if(type() === 'html'){
    <div [innerHTML]="safeIconValue()" [class]="className() + ' flex justify-center items-center ' + this.icon().type"></div>
  }
</div>
